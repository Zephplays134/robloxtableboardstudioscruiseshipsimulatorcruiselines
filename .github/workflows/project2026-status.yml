name: Project 2026 public status snapshot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect public status
        env:
          TZ: UTC
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from datetime import datetime, timezone

          sources = [
            ("Roblox — Cruise Ship Simulator", "https://www.roblox.com/games/17234598656/Cruise-Ship-Simulator"),
            ("Tableboard Studios group mirror", "https://www.rolimons.com/group/4795028"),
            ("Tableboard Studios projects", "https://sites.google.com/view/tableboardstudios/projects"),
          ]
          evidence = []
          combined = ""

          for title, url in sources:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 Project2026Monitor/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read().decode("utf-8", "ignore")
                  text = re.sub(r"<[^>]+>", " ", body)
                  text = re.sub(r"\\s+", " ", text)
                  combined += " " + text
                  evidence.append({"title": title, "detail": "Source checked successfully.", "url": url})
              except Exception as exc:
                  evidence.append({"title": title, "detail": "Source check failed: " + str(exc)[:120], "url": url})

          lower = combined.lower()
          detected = "project 2026" in lower
          testing = "Not publicly confirmed"
          if any(x in lower for x in ["testing server", "test server", "playtest", "play test", "testing"]):
              testing = "Possible testing reference detected"
          release = "To be announced"
          if re.search(r"release date|releases? on|launch date|launches on", lower):
              release = "Release wording detected — review evidence"

          payload = {
              "project2026Detected": detected,
              "testingStatus": testing,
              "releaseStatus": release,
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "evidence": evidence,
              "teasers": [
                  {"icon":"◈","title":"Automatic source scan","detail":"Public sources are checked by the scheduled monitor; the site polls this snapshot every 5 seconds.","meta":"Automated"},
                  {"icon":"▣","title":"Evidence-first status","detail":"The dashboard avoids treating an unverified teaser, rumor, or test claim as confirmed.","meta":"Verified wording"},
                  {"icon":"◎","title":"More public details can appear","detail":"When a checked source changes, the next snapshot can update the dashboard.","meta":"Live monitor"}
              ]
          }
          open("project2026-status.json","w",encoding="utf-8").write(json.dumps(payload,indent=2))
          PY
      - name: Commit snapshot if changed
        run: |
          git config user.name "project2026-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add project2026-status.json
          git diff --cached --quiet || (git commit -m "Refresh Project 2026 public status" && git push)
